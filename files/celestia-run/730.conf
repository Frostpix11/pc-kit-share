# CS2 — X11 (angel-satellite), MangoHud.
# 4:3 без лесенки: окно держится в разрешении игры (_ANGEL_SATELLITE_HOLD, pc-kit), CS2 рисует кадр
# этого размера, а на весь экран его плавно растягивает niri. Разрешение берётся из cs2_video.txt.
ENV=()   # X11 + explicit sync (kit13+) = best; Wayland: ENV=(SDL_VIDEO_DRIVER=wayland)
WRAP=(mangohud)
ARGS=()
_v=$(ls "$HOME"/.local/share/Steam/userdata/*/730/local/cfg/cs2_video.txt 2>/dev/null | head -1)
_w=$(sed -n 's/.*"setting.defaultres"[[:space:]]*"\([0-9]*\)".*/\1/p' "$_v" 2>/dev/null)
_h=$(sed -n 's/.*"setting.defaultresheight"[[:space:]]*"\([0-9]*\)".*/\1/p' "$_v" 2>/dev/null)
[[ -n "$_w" && -n "$_h" && "$_w" != 1920 ]] && HOLD=("Counter-Strike 2" "${_w}x${_h}")
